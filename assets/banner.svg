<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="100%" height="100%" style="background:#09090b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>

    <!-- Radial Lighting Gradients -->
    <radialGradient id="vermilion-glow" cx="50%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#e04e35" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#e04e35" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.015)"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#e04e35"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#e04e35" flood-opacity="0.4"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1280" height="520" fill="#09090b"/>
  <rect width="1280" height="520" fill="url(#grid-pattern)"/>
  <rect width="1280" height="520" fill="url(#vermilion-glow)"/>
  <rect width="1280" height="520" fill="url(#center-glow)"/>

  <!-- Subtle Top Accent Highlight Line -->
  <rect x="340" y="0" width="600" height="2" fill="url(#accent-line)"/>

  <!-- ================= LEFT DECORATIVE CARD: ORGANIZE & ROTATE ================= -->
  <g transform="translate(60, 110)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="250" height="300" rx="14" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="28" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M26 28 h6 v6 h-6 z M34 28 h6 v6 h-6 z M26 36 h6 v6 h-6 z M34 36 h6 v6 h-6 z" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
    <text x="56" y="38" fill="#e4e4e7" font-size="12" font-weight="600">Visual Page Studio</text>
    <text x="210" y="38" fill="#71717a" font-size="10" font-family="monospace">ROT</text>

    <!-- Mini Thumbnail Stage -->
    <rect x="20" y="62" width="210" height="175" rx="8" fill="#121215" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Mini Rotated Sheet -->
    <g transform="translate(125, 150) rotate(90)">
      <rect x="-42" y="-60" width="84" height="120" rx="3" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
      <!-- Content lines -->
      <line x1="-30" y1="-44" x2="24" y2="-44" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-30" y1="-32" x2="16" y2="-32" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="-22" x2="30" y2="-22" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="-12" x2="20" y2="-12" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="-2" x2="28" y2="-2" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="8" x2="10" y2="8" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Card Footer -->
    <text x="26" y="266" fill="#a1a1aa" font-size="11" font-family="monospace">Page 1</text>
    <rect x="175" y="252" width="55" height="20" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="202" y="266" fill="#f4f4f5" font-size="10" font-family="monospace" text-anchor="middle">⟳ 90°</text>
  </g>

  <!-- ================= RIGHT DECORATIVE CARD: SIGN & CROP ================= -->
  <g transform="translate(970, 110)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="250" height="300" rx="14" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="28" height="28" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M27 39 l9 -9 l2 2 l-9 9 z" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
    <text x="56" y="38" fill="#e4e4e7" font-size="12" font-weight="600">Sign &amp; Crop Tool</text>
    <text x="210" y="38" fill="#71717a" font-size="10" font-family="monospace">RAW</text>

    <!-- Mini Sheet Stage -->
    <rect x="20" y="62" width="210" height="175" rx="8" fill="#121215" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <g transform="translate(125, 150)">
      <rect x="-48" y="-68" width="96" height="136" rx="3" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
      
      <!-- Crop handles simulation -->
      <rect x="-42" y="-62" width="84" height="124" fill="none" stroke="#e04e35" stroke-dasharray="3 3" stroke-width="1.2"/>
      
      <!-- Signature spline -->
      <path d="M -30 20 Q -20 5, -10 22 T 10 15 T 30 25" fill="none" stroke="#09090b" stroke-width="2.2" stroke-linecap="round"/>
      
      <!-- Mini Hanko stamp -->
      <rect x="18" y="30" width="16" height="16" rx="2" fill="#e04e35"/>
      <text x="26" y="42" fill="#ffffff" font-size="9" font-family="serif" font-weight="bold" text-anchor="middle">本</text>
    </g>

    <!-- Card Footer -->
    <text x="26" y="266" fill="#10b981" font-size="11" font-weight="500">● 100% Client-Side</text>
    <text x="224" y="266" fill="#71717a" font-size="10" font-family="monospace" text-anchor="end">READY</text>
  </g>

  <!-- ================= CENTER HERO SECTION ================= -->
  <!-- Top Category Badge -->
  <g transform="translate(640, 75)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
    <circle cx="-62" cy="0" r="3.5" fill="#e04e35"/>
    <text x="-50" y="4" fill="#a1a1aa" font-size="11" font-weight="600" letter-spacing="1">ENGINEERING PDF</text>
  </g>

  <!-- Hanko Seal Icon -->
  <g transform="translate(640, 140)">
    <rect x="-30" y="-30" width="60" height="60" rx="15" fill="#e04e35" filter="url(#seal-shadow)" stroke="#f87171" stroke-width="1.5"/>
    <text x="0" y="14" fill="#ffffff" font-size="34" font-weight="700" font-family="'Shippori Mincho', 'Songti SC', serif" text-anchor="middle">本</text>
  </g>

  <!-- Brand Title -->
  <text x="640" y="240" fill="#f4f4f5" font-size="52" font-weight="700" letter-spacing="-1.5" text-anchor="middle">
    Honjin
  </text>

  <!-- Tagline / Subtitle -->
  <text x="640" y="278" fill="#a1a1aa" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="-0.3">
    The quiet art of working with paper.
  </text>
  <text x="640" y="304" fill="#71717a" font-size="13" font-weight="400" text-anchor="middle">
    Fast, private, client-side PDF utility suite with zero server uploads.
  </text>

  <!-- Tactical Feature Pills Bar -->
  <g transform="translate(640, 360)">
    <!-- Main pill container -->
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="rgba(18, 18, 21, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Pill elements -->
    <circle cx="-235" cy="0" r="4" fill="#10b981"/>
    <text x="-222" y="4" fill="#d4d4d8" font-size="12" font-weight="500">100% On-Device</text>
    
    <text x="-120" y="4" fill="rgba(255,255,255,0.2)" font-size="12">•</text>
    <text x="-95" y="4" fill="#d4d4d8" font-size="12" font-weight="500">12 Visual Tools</text>
    
    <text x="0" y="4" fill="rgba(255,255,255,0.2)" font-size="12">•</text>
    <text x="25" y="4" fill="#d4d4d8" font-size="12" font-weight="500">Zero CORS / Offline</text>

    <text x="155" y="4" fill="rgba(255,255,255,0.2)" font-size="12">•</text>
    <text x="175" y="4" fill="#e04e35" font-size="12" font-weight="600">bedanta.space</text>
  </g>

  <!-- Bottom Interactive Tool Badges -->
  <g transform="translate(640, 435)">
    <g fill="#71717a" font-size="11" font-family="monospace" text-anchor="middle">
      <rect x="-380" y="-12" width="70" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="-345" y="4">Organize</text>

      <rect x="-295" y="-12" width="55" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="-267" y="4">Rotate</text>

      <rect x="-225" y="-12" width="50" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="-200" y="4">Sign</text>

      <rect x="-160" y="-12" width="50" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="-135" y="4">Crop</text>

      <rect x="-95" y="-12" width="55" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="-67" y="4">Merge</text>

      <rect x="-25" y="-12" width="50" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="0" y="4">Split</text>

      <rect x="40" y="-12" width="80" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="80" y="4">Watermark</text>

      <rect x="135" y="-12" width="95" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="182" y="4">Page Numbers</text>

      <rect x="245" y="-12" width="70" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="280" y="4">PDF to Img</text>

      <rect x="330" y="-12" width="70" height="24" rx="5" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="365" y="4">Img to PDF</text>
    </g>
  </g>
</svg>
